server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compression
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Assets versionnés : cache long
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # En-têtes de sécurité
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # CSP — étendre script-src/connect-src si l'API ou l'analytics sont sur un autre domaine.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' https://plausible.io; connect-src 'self' https://plausible.io; manifest-src 'self'" always;

  # Fallback SPA
  location / {
    try_files $uri $uri/ /index.html;
  }
}
