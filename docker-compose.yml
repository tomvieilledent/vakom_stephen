services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vakom
      POSTGRES_PASSWORD: vakom
      POSTGRES_DB: vakom
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vakom']
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://vakom:vakom@db:5432/vakom
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '8000:8000'

  web:
    build: .
    ports:
      - '8080:80'
    depends_on:
      - backend

volumes:
  db_data:
